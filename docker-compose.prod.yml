services:
  postgres:
    image: postgres:17
    container_name: skillsphere-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillsphere}
      POSTGRES_USER: ${POSTGRES_USER:-skillsphere_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}
    # Security: No exposed host ports in production (PostgreSQL accessible only within private network)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - skillsphere_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillsphere_user} -d ${POSTGRES_DB:-skillsphere}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillsphere-backend-prod
    restart: always
    user: "1000:1000"
    environment:
      - DB_NAME=${POSTGRES_DB:-skillsphere}
      - DB_USER=${POSTGRES_USER:-skillsphere_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required in production}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS must be defined for production}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - SECURE_PROXY_SSL_HEADER=True
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-False}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-False}
      - CSRF_COOKIE_SECURE=${CSRF_COOKIE_SECURE:-False}
      - SECURE_HSTS_SECONDS=${SECURE_HSTS_SECONDS:-0}
      - CONN_MAX_AGE=${CONN_MAX_AGE:-300}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gemini-1.5-flash}
    # Security: No exposed host ports in production (Backend accessible only via Nginx reverse proxy)
    volumes:
      - django_static_volume:/app/staticfiles
    networks:
      - skillsphere_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M

  frontend:
    build:
      context: ./frontend/skillsphere-frontend
      dockerfile: Dockerfile
    container_name: skillsphere-frontend-prod
    restart: always
    # Ingress Gateway: Sole entry point publishing external host ports
    # Port 80 handles HTTP traffic and Let's Encrypt domain verification.
    # Enable port 443 once TLS certificates are provisioned via Certbot (see docs/deployment_readiness_plan.md).
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - django_static_volume:/usr/share/nginx/html/static:ro
      # Enable certificate mounts and production Nginx config once TLS certificates are provisioned:
      # - /etc/letsencrypt:/etc/letsencrypt:ro
      # - /var/www/certbot:/var/www/certbot:ro
      # - ./frontend/skillsphere-frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - skillsphere_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  skillsphere_internal:
    driver: bridge

volumes:
  postgres_data:
    external: true
    name: skillsphere_skillsphere_postgres_data
  django_static_volume:
