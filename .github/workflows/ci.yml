name: SkillSphere Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test_skillsphere
          POSTGRES_USER: skillsphere_ci_user
          POSTGRES_PASSWORD: skillsphere_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django system checks
        working-directory: backend
        env:
          DEBUG: "True"
          SECRET_KEY: "ci-insecure-test-secret-key-for-automated-pipeline-checks"
        run: |
          python manage.py check

      - name: Run Django backend test suite
        working-directory: backend
        env:
          DB_NAME: test_skillsphere
          DB_USER: skillsphere_ci_user
          DB_PASSWORD: skillsphere_ci_password
          DB_HOST: localhost
          DB_PORT: 5432
          DEBUG: "True"
          SECRET_KEY: "ci-insecure-test-secret-key-for-automated-pipeline-checks"
        run: |
          python manage.py test -v 2

      - name: Verify static files collection
        working-directory: backend
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-insecure-test-secret-key-for-automated-pipeline-checks"
        run: |
          python manage.py collectstatic --noinput --dry-run

  frontend-test-and-build:
    name: Frontend Tests and Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/skillsphere-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/skillsphere-frontend
        run: |
          npm ci

      - name: Run Karma unit tests
        working-directory: frontend/skillsphere-frontend
        run: |
          npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build production bundle
        working-directory: frontend/skillsphere-frontend
        run: |
          npm run build -- --configuration production

  docker-compose-lint:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_DB: skillsphere
          POSTGRES_USER: skillsphere_user
          POSTGRES_PASSWORD: skillsphere_password
          SECRET_KEY: "ci-insecure-test-secret-key-for-automated-pipeline-checks"
        run: |
          docker compose config --quiet
