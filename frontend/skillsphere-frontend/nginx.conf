server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Maximum client request body size (uploads, certificates, media)
    client_max_body_size 25M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Production security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------
    # System Health Probe Ingress (Stage 22.4 & Final Fix 2)
    # ------------------------------------------------------------
    location = /health {
        proxy_pass http://backend:8000/api/health/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /health/ {
        proxy_pass http://backend:8000/api/health/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ------------------------------------------------------------
    # 1. Django Admin Routing (Stage 22.3 & Final Fix 1)
    # ------------------------------------------------------------
    location = /admin {
        return 301 $scheme://$http_host/admin/;
    }

    location ^~ /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # ------------------------------------------------------------
    # 2. Django REST API Routing (Stage 22.3 & Final Fix 1)
    # ------------------------------------------------------------
    location = /api {
        return 301 $scheme://$http_host/api/;
    }

    location ^~ /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # ------------------------------------------------------------
    # 3. Django Static Assets (/static/ -> shared volume) (Stage 22.3)
    # ------------------------------------------------------------
    location ^~ /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ------------------------------------------------------------
    # 4. Content-Hashed Script & Style Bundles (immutable caching)
    # ------------------------------------------------------------
    location ~* \.(?:css|js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Font Assets (immutable caching)
    location ~* \.(?:woff2?|eot|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Generic Static Media and Icons (short-term caching, revalidatable)
    location ~* \.(?:svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # ------------------------------------------------------------
    # 5. Angular SPA Entrypoint (index.html - must revalidate)
    # ------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ------------------------------------------------------------
    # 6. Angular SPA Fallback (Deep Links)
    # ------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
